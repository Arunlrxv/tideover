[workspace]
resolver = "2"
members = [
    "crates/tideover-zk",
    "crates/tideover-wasm",
    "contracts/fund",
    "contracts/factory",
    "contracts/test-usd",
    "contracts/anon-poll",
    "clerk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

# arkworks: all no_std-capable; `std` is enabled only in native tools and the browser prover.
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false, features = ["derive"] }
ark-relations = { version = "0.6", default-features = false }
ark-r1cs-std = { version = "0.6", default-features = false }
ark-snark = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6", default-features = false }
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-crypto-primitives = { version = "0.6", default-features = false, features = ["sponge"] }

borsh = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Dependencies are optimised even in dev builds, so tests prove in seconds.
[profile.dev.package."*"]
opt-level = 3

# What npm run build:contracts deploys. Storage costs far more than the extra gas here:
# a kilobyte of code locks 0.01 NEAR, and a million wasm instructions burn under 0.0001.
[profile.contract]
inherits = "release"
opt-level = "z"

# Native tools, the clerk and the browser prover, where speed is what counts.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
